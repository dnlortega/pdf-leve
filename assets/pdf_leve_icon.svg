  <g fill="#d6c6ab">
    <rect x="362" y="486" width="196" height="20" rx="10"/>
    <rect x="362" y="546" width="258" height="20" rx="10" fill="#cbb89a"/>
    <rect x="362" y="606" width="152" height="20" rx="10"/>
    <rect x="362" y="666" width="218" height="20" rx="10"/>
