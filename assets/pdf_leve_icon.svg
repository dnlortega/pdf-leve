  <g filter="url(#tileShadow)">
    <rect x="48" y="48" width="928" height="928" rx="214" fill="url(#tile)"/>
    <rect x="48" y="48" width="928" height="928" rx="214" fill="url(#glow)"/>
    <rect x="50.5" y="50.5" width="923" height="923" rx="211.5" fill="none" stroke="#5a4d3d" stroke-opacity="0.55" stroke-width="5"/>
  </g>

  <g filter="url(#pageShadow)">
    <path d="M 354 208 H 598 L 702 312 V 784 Q 702 816 670 816 H 354 Q 322 816 322 784 V 240 Q 322 208 354 208 Z" fill="url(#page)"/>
    <path d="M 598 208 V 312 H 702 Z" fill="url(#fold)"/>
    <path d="M 598 208 V 312 H 702" fill="none" stroke="#c9b492" stroke-opacity="0.85" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 598 312 H 322" fill="none" stroke="#d8c6a8" stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <g filter="url(#ribbonShadow)">
    <path d="M 492 208 H 540 V 422 L 516 396 L 492 422 Z" fill="url(#ribbon)"/>
    <path d="M 492 208 H 540" stroke="#f6d9a4" stroke-opacity="0.35" stroke-width="3"/>
