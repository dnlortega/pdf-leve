<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d352c"/>
      <stop offset="0.55" stop-color="#2d2721"/>
      <stop offset="1" stop-color="#201c18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#fff1d6" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#fff1d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.62" stop-color="#fbf3e5"/>
      <stop offset="1" stop-color="#f3e7d3"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e2cb"/>
      <stop offset="1" stop-color="#dcc8a8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#d99a3f"/>
      <stop offset="0.55" stop-color="#bf7420"/>
      <stop offset="1" stop-color="#9c5712"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b06a1a"/>
